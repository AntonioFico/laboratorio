<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gli strumenti del capitano</title><style> *{box-sizing:border-box}body{margin:0;background:#f5ead3;color:#493820;font-family:Georgia,serif;text-align:center;padding:16px}h1{font-size:clamp(22px,5vw,36px);margin:8px 0 20px}.pair{display:flex;justify-content:center;gap:clamp(8px,3vw,32px)}section{width:min(45vw,340px)}h2{font-size:clamp(18px,4vw,28px);margin:8px}svg{width:100%;height:auto;filter:drop-shadow(0 4px 3px #0002)}button{font:inherit;background:#654a2c;color:white;border:0;border-radius:10px;padding:12px 20px;margin:15px}#status{font:15px system-ui;max-width:650px;margin:auto}p{font-size:clamp(16px,3vw,22px)}</style><h1>Gli strumenti del capitano</h1><div class="pair"><section><h2>Orologio</h2><svg id="clock" viewBox="0 0 240 240"></svg></section><section><h2>Bussola</h2><svg id="compass" viewBox="0 0 240 240"></svg></section></div><p>Gira su te stessa... quale lancetta cambia direzione?</p><button id="start">Attiva la bussola</button><div id="status" role="status">Tieni il telefono in piano, con lo schermo rivolto verso l’alto.</div><script>
const face='<circle cx="120" cy="120" r="114" fill="#b99a61" stroke="#604827" stroke-width="3"/><circle cx="120" cy="120" r="105" fill="#fff9e9" stroke="#80613c" stroke-width="2"/>';
const c=document.querySelector('#clock'), b=document.querySelector('#compass');let ticks='',nums='';for(let i=0;i<60;i++){ticks+=`<line x1="120" y1="20" x2="120" y2="${i%5===0?31:25}" stroke="#59452b" stroke-width="${i%5===0?3:1}" transform="rotate(${i*6} 120 120)"/>`;if(i%5===0){let a=i*Math.PI/30;nums+=`<text x="${120+77*Math.sin(a)}" y="${120-77*Math.cos(a)+7}" text-anchor="middle" font-size="22" fill="#493820">${i/5||12}</text>`;}}
c.innerHTML=face+ticks+nums+'<line id="hour" x1="120" y1="128" x2="120" y2="65" stroke="#493820" stroke-width="8" stroke-linecap="round"/><line id="minute" x1="120" y1="130" x2="120" y2="39" stroke="#493820" stroke-width="5" stroke-linecap="round"/><line id="second" x1="120" y1="135" x2="120" y2="33" stroke="#b94035" stroke-width="2"/><circle cx="120" cy="120" r="6" fill="#493820"/>';
b.innerHTML=face+ticks+'<g font-size="23" font-weight="bold" text-anchor="middle" fill="#493820"><text x="120" y="50" fill="#b94035">N</text><text x="120" y="207">S</text><text x="199" y="128">E</text><text x="41" y="128">O</text></g><g id="needle" visibility="hidden"><path d="M120 49 L105 120 L120 191 L135 120 Z" fill="#647e99" stroke="#493820"/><path d="M120 49 L105 120 L135 120 Z" fill="#c23e35"/><circle cx="120" cy="120" r="6" fill="#493820"/></g>';
function rotate(id,a){document.getElementById(id).setAttribute('transform',`rotate(${a} 120 120)`)}function clock(){let d=new Date();rotate('hour',30*(d.getHours()%12)+d.getMinutes()/2);rotate('minute',6*d.getMinutes()+d.getSeconds()/10);rotate('second',6*d.getSeconds())}clock();setInterval(clock,250);
let received=false;const status=document.querySelector('#status');function orient(e){let h;if(Number.isFinite(e.webkitCompassHeading)&&e.webkitCompassHeading>=0)h=e.webkitCompassHeading;else if(e.absolute===true&&Number.isFinite(e.alpha))h=(360-e.alpha)%360;else return;let screenAngle=screen.orientation?.angle??window.orientation??0;rotate('needle',-h-screenAngle);document.getElementById('needle').setAttribute('visibility','visible');received=true;status.textContent='Bussola attiva. Tieni il telefono in piano e lontano da oggetti metallici.';}
document.querySelector('#start').onclick=async()=>{if(!window.isSecureContext){status.textContent='Il browser non considera sicura questa pagina. Per accedere alla bussola potrebbe essere necessario aprirla tramite HTTPS.';return;}try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Sensore non disponibile nel browser');if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Permesso non concesso');window.addEventListener('deviceorientationabsolute',orient);window.addEventListener('deviceorientation',orient);status.textContent='In attesa del sensore…';setTimeout(()=>{if(!received)status.textContent='Nessun dato di orientamento assoluto ricevuto. Controlla i permessi del browser o prova ad aprire la pagina tramite HTTPS.'},4000)}catch(e){status.textContent=e.message}};
</script></html>
